name: ssh command

on:
  push:
    branches:
      - develop   # developブランチにpushがあった時に実行

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      - run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/miyu_hamaoka/deploy.sh miyu_hamaoka
